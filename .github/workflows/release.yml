name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    # Note: we ship a glibc (gnu) build, not musl. myc-run's mount/statfs
    # code (nix FsFlags, libc types) does not currently compile against the
    # musl target; revisit once that is portable. The gnu binary runs on any
    # glibc >= the runner's (ubuntu-latest), which covers GitHub CI runners
    # and current distros — WSL2 included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p myc-cli

      - name: Rename binary
        run: |
          cp target/release/myc myc-linux-x86_64
          ./myc-linux-x86_64 --version
          # sha256 sidecar (plain sha256sum format) — `myc update` refuses
          # an update when it is missing or mismatched.
          sha256sum myc-linux-x86_64 > myc-linux-x86_64.sha256

      - name: Upload twin for the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: myc-linux-x86_64
          path: myc-linux-x86_64

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            myc-linux-x86_64
            myc-linux-x86_64.sha256

  # aarch64 (was TODO(aarch64)): native build on GitHub's free arm64 runners
  # (public repos — label `ubuntu-24.04-arm`), no cross toolchain involved.
  # The workspace is continuously validated on the same runner image by
  # .github/workflows/ci-arm64.yml (fmt + clippy + tests); this job only
  # runs on tags, so it cannot be exercised without cutting a release —
  # that is the accepted, documented limitation.
  # HONEST SCOPE (project LOI: no unmeasured claims): this ships the
  # aarch64 *binary distribution*; the kvm-microvm engine still executes
  # x86_64 guests only (see crates/myc-backend/src/kvm.rs — the guard
  # reports the engine unavailable on aarch64 hosts).
  linux-aarch64:
    name: Linux aarch64
    # Same glibc rationale as the x86_64 job (no musl; nix/libc types).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p myc-cli

      - name: Rename binary + sha256 sidecar
        run: |
          cp target/release/myc myc-linux-aarch64
          ./myc-linux-aarch64 --version
          sha256sum myc-linux-aarch64 > myc-linux-aarch64.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            myc-linux-aarch64
            myc-linux-aarch64.sha256

  assets-microvm:
    name: microVM guest assets (kernel + initramfs)
    runs-on: ubuntu-latest
    # Guest assets consumed by the kvm-microvm engine and by
    # scripts/install.sh --with-vm. Independent of the binary jobs — runs in
    # parallel with them. Dependencies read off the scripts themselves:
    # - build_kernel_vmfs.sh: gcc/make (build-essential), flex, bison, bc,
    #   libelf-dev (objtool), libssl-dev, curl/tar/xz (runner base image).
    # - mkinit-vm.sh: busybox at /usr/bin/busybox (busybox-static), cpio.
    #   No Rust involved, so no musl/gcc-cross needed here.
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libelf-dev libssl-dev cpio busybox-static xz-utils

      - name: Build guest kernel (vmlinux-vmfs)
        run: |
          # mkinit-vm.sh is committed 0644 — exec bit restored here.
          chmod +x bench/microvm/build_kernel_vmfs.sh bench/microvm/mkinit-vm.sh
          bench/microvm/build_kernel_vmfs.sh

      - name: Build guest initramfs (init-vm.cpio)
        run: bench/microvm/mkinit-vm.sh

      - name: sha256 sidecars + assets README
        run: |
          cd bench/microvm/assets
          sha256sum vmlinux-vmfs > vmlinux-vmfs.sha256
          sha256sum vmlinux-vmfs.elf > vmlinux-vmfs.elf.sha256
          sha256sum init-vm.cpio > init-vm.cpio.sha256
          cat > README-assets.txt <<'EOF'
          Mycel KVM microVM guest assets
          ==============================

          vmlinux-vmfs   guest kernel: minimal Linux 6.12.x with VIRTIO_FS +
                         FUSE_FS + EXT4_FS + OVERLAY_FS built in (built from
                         bench/microvm/build_kernel_vmfs.sh, sources public).
          init-vm.cpio   generic guest initramfs (busybox + /init stage 1,
                         built from bench/microvm/mkinit-vm.sh).

          Install into /usr/local/share/mycel/ (the engine's default paths):
              curl -fsSL https://raw.githubusercontent.com/Felmond13/mycel/main/scripts/install.sh | sh -s -- --with-vm
          `myc` also auto-downloads both files into ~/.mycel/vm-assets/ on
          the first kvm-microvm run when they are missing.

          Verify with sha256sum -c <file>.sha256 (each sidecar sits next to
          its asset; sha256 verified by the installer and by `myc` itself).
          EOF
          ls -l vmlinux-vmfs init-vm.cpio *.sha256 README-assets.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bench/microvm/assets/vmlinux-vmfs
            bench/microvm/assets/vmlinux-vmfs.sha256
            bench/microvm/assets/vmlinux-vmfs.elf
            bench/microvm/assets/vmlinux-vmfs.elf.sha256
            bench/microvm/assets/init-vm.cpio
            bench/microvm/assets/init-vm.cpio.sha256
            bench/microvm/assets/README-assets.txt

  # aarch64 guest assets, kept as a SEPARATE job from assets-microvm so the
  # x86_64 pipeline stays untouched. Same scripts, ARCH=aarch64, NATIVE
  # build on the arm64 runner (no cross-compiler). HONEST SCOPE: these
  # assets are published for the aarch64 pipeline; the kvm-microvm engine
  # does NOT consume them yet (engine wiring pending hardware validation —
  # no boot, no e2e, no number has been measured on arm64; see
  # docs/isolation-engines.md). The kernel/initramfs build itself can be
  # exercised before a tag via ci-arm64.yml (workflow_dispatch, job
  # guest-assets-aarch64).
  assets-microvm-arm64:
    name: microVM guest assets (kernel + initramfs, aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libelf-dev libssl-dev cpio busybox-static xz-utils file

      - name: Build guest kernel (vmlinux-vmfs-aarch64)
        run: |
          # mkinit-vm.sh is committed 0644 — exec bit restored here.
          chmod +x bench/microvm/build_kernel_vmfs.sh bench/microvm/mkinit-vm.sh
          ARCH=aarch64 bench/microvm/build_kernel_vmfs.sh

      - name: Build guest initramfs (init-vm-aarch64.cpio)
        run: ARCH=aarch64 bench/microvm/mkinit-vm.sh

      - name: sha256 sidecars + assets README
        run: |
          cd bench/microvm/assets
          sha256sum vmlinux-vmfs-aarch64 > vmlinux-vmfs-aarch64.sha256
          sha256sum vmlinux-vmfs-aarch64.elf > vmlinux-vmfs-aarch64.elf.sha256
          sha256sum init-vm-aarch64.cpio > init-vm-aarch64.cpio.sha256
          cat > README-assets-aarch64.txt <<'EOF'
          Mycel KVM microVM guest assets — aarch64
          =======================================

          vmlinux-vmfs-aarch64   guest kernel: minimal Linux 6.12.x arm64 with
                                 VIRTIO_FS + FUSE_FS + EXT4_FS + OVERLAY_FS
                                 built in, PL011 console (built from
                                 bench/microvm/build_kernel_vmfs.sh with
                                 ARCH=aarch64, native arm64 build).
          init-vm-aarch64.cpio   generic guest initramfs (arm64 busybox +
                                 /init stage 1, built from
                                 bench/microvm/mkinit-vm.sh with ARCH=aarch64).

          STATUS — read before using: these assets are PUBLISHED, not
          VALIDATED. The myc kvm-microvm engine currently executes x86_64
          guests only; on aarch64 hosts it reports itself unavailable
          (`myc doctor` explains). Engine wiring on arm64 is pending
          hardware validation — no boot or e2e measurement exists yet.

          Verify with sha256sum -c <file>.sha256 (each sidecar sits next to
          its asset).
          EOF
          ls -l vmlinux-vmfs-aarch64 init-vm-aarch64.cpio *.sha256 README-assets-aarch64.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bench/microvm/assets/vmlinux-vmfs-aarch64.elf
            bench/microvm/assets/vmlinux-vmfs-aarch64.elf.sha256
            bench/microvm/assets/vmlinux-vmfs-aarch64
            bench/microvm/assets/vmlinux-vmfs-aarch64.sha256
            bench/microvm/assets/init-vm-aarch64.cpio
            bench/microvm/assets/init-vm-aarch64.cpio.sha256
            bench/microvm/assets/README-assets-aarch64.txt

  windows:
    name: Windows x86_64 (embedded Linux twin)
    runs-on: windows-latest
    needs: linux
    # Two-stage build (see scripts/build-windows.ps1): the Linux twin built
    # above is embedded into myc.exe so the Windows binary is self-contained.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download Linux twin
        uses: actions/download-artifact@v4
        with:
          name: myc-linux-x86_64

      - name: Build myc.exe with embedded twin
        shell: pwsh
        run: |
          $env:MYCEL_LINUX_BINARY = "$PWD\myc-linux-x86_64"
          cargo build --release -p myc-cli
          Copy-Item target\release\myc.exe myc-windows-x86_64.exe
          .\myc-windows-x86_64.exe --version
          # sha256 sidecar (sha256sum-compatible: lowercase hex + filename)
          # — `myc update --host` refuses an update without it.
          $hash = (Get-FileHash -Algorithm SHA256 myc-windows-x86_64.exe).Hash.ToLower()
          Set-Content -Encoding ascii myc-windows-x86_64.exe.sha256 "$hash  myc-windows-x86_64.exe"
          Get-Content myc-windows-x86_64.exe.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            myc-windows-x86_64.exe
            myc-windows-x86_64.exe.sha256
