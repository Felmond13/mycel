[package]
name = "myc-backend"
description = "Execution backends: native Linux namespaces, transparent WSL2 proxying on Windows, VM scaffold for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myc-manifest = { workspace = true }
myc-store = { workspace = true }
myc-run = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
# /myc/run.json inside the guest rootfs (the guest itself sources the
# shell-quoted run.env — JSON is for humans and post-mortem debugging).
serde_json = { workspace = true }
# SIGINT/SIGTERM trap so a Ctrl-C or `kill` shuts the microVM down through
# the normal path instead of leaking the VMM. "termination" = also trap
# SIGTERM, not just Ctrl-C.
ctrlc = { workspace = true, features = ["termination"] }
# Guest asset auto-provision (kvm.rs): one-shot downloads of vmlinux-vmfs /
# init-vm.cpio from GitHub Releases on binary installs. Blocking client on
# purpose — the engine is synchronous (run on a dedicated thread when the
# caller may be async).
reqwest = { workspace = true }
# sha256 of downloaded assets against the published .sha256 sidecars (also
# used on Windows to check the embedded Linux twin).
sha2 = { workspace = true }
hex = { workspace = true }
